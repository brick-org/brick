name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$VERSION'. Use format vX.Y.Z (e.g. v0.1.0)."
            exit 1
          fi
          for TAG in "$VERSION" "dsl/$VERSION"; do
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag '$TAG' already exists. Pick a new version."
              exit 1
            fi
          done

      - name: Prepare release context
        run: |
          NEW="${{ inputs.version }}"
          # Previous root release (dsl/* tags excluded by the pattern).
          # Computed BEFORE the bump commit below so the changelog entry,
          # the release notes, and the tagged range all agree — the bump
          # commit itself must not appear in its own release notes.
          PREV=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$NEW" | head -1)
          {
            echo "PREV_TAG=${PREV}"
            echo "RELEASE_DATE=$(date -u +%Y-%m-%d)"
            echo 'RELEASE_LOG<<EOF'
            if [ -n "$PREV" ]; then
              git log "$PREV..HEAD" --pretty=format:'- %s (%h)' --no-merges
            else
              git log HEAD --pretty=format:'- %s (%h)' --no-merges | head -50
            fi
            echo 'EOF'
          } >> "$GITHUB_ENV"
          echo "prev=$PREV"

      - name: Bump versions
        run: |
          VERSION="${{ inputs.version }}"
          # Lockstep versions: the runtime requires the dsl module at the
          # same version, and the examples pin both. No `go` directives.
          sed -i "s|\(brick-org/brick/dsl \)v[0-9][0-9.]*|\1${VERSION}|" \
            brick/go.mod examples/shop/dsl/go.mod
          sed -i "s|\(brick-org/brick \)v[0-9][0-9.]*|\1${VERSION}|" \
            examples/shop/app/go.mod
          git diff --stat

      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ inputs.version }}"
          LOG="$RELEASE_LOG"
          [ -z "$LOG" ] && LOG="- No new commits."
          ENTRY=$(mktemp)
          {
            echo "## ${VERSION} (${RELEASE_DATE})"
            echo
            echo "$LOG"
            echo
          } > "$ENTRY"
          [ -f CHANGELOG.md ] || printf '# Changelog\n' > CHANGELOG.md
          { head -1 CHANGELOG.md; echo; cat "$ENTRY"; tail -n +2 CHANGELOG.md; } > CHANGELOG.md.new
          # Collapse accidental blank runs; changelog bodies never need them.
          awk 'BEGIN{b=0} /^$/{b++; if(b<=1)print; next} {b=0; print}' CHANGELOG.md.new > CHANGELOG.md
          rm -f "$ENTRY" CHANGELOG.md.new
          head -14 CHANGELOG.md

      - name: Commit release
        run: |
          VERSION="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "already at ${VERSION}; nothing to commit"
          else
            git add brick/go.mod examples/shop/dsl/go.mod examples/shop/app/go.mod CHANGELOG.md
            git commit -m "chore(release): bump to ${VERSION}"
            git push origin HEAD:main
          fi

      - name: Create and push tags
        run: |
          # Tags point at the bump commit above (or main HEAD when the
          # requires were already current).
          git pull --rebase origin main
          # Brick ships two modules versioned in lockstep: the runtime at
          # the repo root and the dependency-free DSL toolchain in dsl/.
          # Both tags are required — brick/go.mod requires
          # github.com/brick-org/brick/dsl at the same version.
          git tag -a "${{ inputs.version }}" -m "${{ inputs.version }}"
          git tag -a "dsl/${{ inputs.version }}" -m "dsl/${{ inputs.version }}"
          git push origin "${{ inputs.version }}" "dsl/${{ inputs.version }}"

      - name: Build release notes from main
        run: |
          # Same pre-bump log as the changelog entry (see Prepare step):
          # the bump commit must not appear in its own release notes.
          {
            if [ -n "$PREV_TAG" ]; then
              echo "## What's changed on main since $PREV_TAG"
            else
              echo "## What's changed"
            fi
            echo
            if [ -z "$RELEASE_LOG" ]; then
              echo "- No new commits."
            else
              echo "$RELEASE_LOG"
            fi
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          body_path: release-notes.md
