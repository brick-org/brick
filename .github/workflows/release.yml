name: Release

on:
  # No inputs: the version is computed from conventional commits on main
  # since the previous tag (feat -> minor, fix -> patch, ! -> major,
  # with pre-1.0 breaking bumping minor). Just press Run.
  #
  # Tag scheme: brick/vX.Y.Z (runtime), auth/vX.Y.Z (standalone auth), and
  # dsl/vX.Y.Z (toolchain). Bare vX tags serve no module (no root go.mod)
  # and are no longer created. The GitHub Release attaches to brick/vX.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        run: |
          # Previous runtime release. Falls back to the last bare tag once,
          # for the transition release (bare vX tags serve no module and
          # are discontinued after that).
          PREV=$(git tag --list 'brick/v[0-9]*' --sort=-v:refname | head -1)
          if [ -n "$PREV" ]; then
            BASE="${PREV#brick/v}"
          else
            PREV=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
            BASE="${PREV#v}"
          fi
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
          else
            RANGE="HEAD"
            BASE="0.0.0"
          fi
          SUBJECTS=$(git log "$RANGE" --pretty=format:'%s')
          BODIES=$(git log "$RANGE" --pretty=format:'%B')
          if [ -z "$SUBJECTS" ]; then
            echo "Nothing new on main since ${PREV:-the beginning}; nothing to release."
            exit 1
          fi
          BUMP=patch
          if echo "$SUBJECTS" | grep -Eq '^[[:alnum:]]+(\([^)]*\))?!:' \
            || echo "$BODIES" | grep -Eq 'BREAKING[ -]CHANGE'; then
            BUMP=major
          elif echo "$SUBJECTS" | grep -Eq '^feat(\([^)]*\))?:'; then
            BUMP=minor
          fi
          MAJOR=${BASE%%.*}; TMP=${BASE#*.}; MINOR=${TMP%%.*}; PATCH=${TMP##*.}
          case "$BUMP" in
            major) N="$((MAJOR+1)).0.0" ;;
            minor) N="${MAJOR}.$((MINOR+1)).0" ;;
            patch) N="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          esac
          # Pre-1.0 convention: breaking changes bump minor, never major.
          if [ "$MAJOR" = "0" ] && [ "$BUMP" = "major" ]; then
            N="0.$((MINOR+1)).0"
          fi
          VERSION="v${N}"
          for TAG in "brick/$VERSION" "auth/$VERSION" "dsl/$VERSION"; do
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag '$TAG' already exists."
              exit 1
            fi
          done
          {
            echo "VERSION=${VERSION}"
            echo "PREV_TAG=${PREV}"
          } >> "$GITHUB_ENV"
          echo "bump=$BUMP base=$BASE -> $VERSION"

      - name: Prepare release context
        run: |
          # Log is computed BEFORE the bump commit below so the changelog
          # entry, the release notes, and the tagged range all agree.
          {
            echo "RELEASE_DATE=$(date -u +%Y-%m-%d)"
            echo 'RELEASE_LOG<<EOF'
            # NOTE: the trailing `sed` is load-bearing. `git log --pretty=format:`
            # emits no newline after the last line, so without it the closing
            # `EOF` would concatenate onto the final commit line and the runner
            # would fail with "Matching delimiter not found 'EOF'".
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..HEAD" --pretty=format:'- %s (%h)' --no-merges | sed -e '$a\'
            else
              git log HEAD --pretty=format:'- %s (%h)' --no-merges | head -50 | sed -e '$a\'
            fi
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Bump versions
        run: |
          # Lockstep versions: the runtime requires the dsl module at the
          # same version, and the examples pin both. No `go` directives.
          sed -i "s|\(brick-org/brick/dsl \)v[0-9][0-9.]*|\1${VERSION}|" \
            brick/go.mod examples/shop/dsl/go.mod
          sed -i "s|\(brick-org/brick/brick \)v[0-9][0-9.]*|\1${VERSION}|" \
            examples/shop/app/go.mod
          git diff --stat

      - name: Update CHANGELOG.md
        run: |
          LOG="$RELEASE_LOG"
          [ -z "$LOG" ] && LOG="- No new commits."
          ENTRY=$(mktemp)
          {
            echo "## ${VERSION} (${RELEASE_DATE})"
            echo
            echo "$LOG"
            echo
          } > "$ENTRY"
          [ -f CHANGELOG.md ] || printf '# Changelog\n' > CHANGELOG.md
          { head -1 CHANGELOG.md; echo; cat "$ENTRY"; tail -n +2 CHANGELOG.md; } > CHANGELOG.md.new
          # Collapse accidental blank runs; changelog bodies never need them.
          awk 'BEGIN{b=0} /^$/{b++; if(b<=1)print; next} {b=0; print}' CHANGELOG.md.new > CHANGELOG.md
          rm -f "$ENTRY" CHANGELOG.md.new
          head -14 CHANGELOG.md

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "already at ${VERSION}; nothing to commit"
          else
            git add brick/go.mod examples/shop/dsl/go.mod examples/shop/app/go.mod CHANGELOG.md
            git commit -m "chore(release): bump to ${VERSION}"
            git push origin HEAD:main
          fi

      - name: Create and push tags
        run: |
          # Tags point at the bump commit above (or main HEAD when the
          # requires were already current).
          git pull --rebase origin main
          # One tag per public module; no bare tags (no root go.mod).
          git tag -a "brick/$VERSION" -m "brick/$VERSION"
          git tag -a "auth/$VERSION" -m "auth/$VERSION"
          git tag -a "dsl/$VERSION" -m "dsl/$VERSION"
          git push origin "brick/$VERSION" "auth/$VERSION" "dsl/$VERSION"

      - name: Build release notes from main
        run: |
          # Same pre-bump log as the changelog entry (see Prepare step):
          # the bump commit must not appear in its own release notes.
          {
            if [ -n "$PREV_TAG" ]; then
              echo "## What's changed on main since $PREV_TAG"
            else
              echo "## What's changed"
            fi
            echo
            if [ -z "$RELEASE_LOG" ]; then
              echo "- No new commits."
            else
              echo "$RELEASE_LOG"
            fi
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: brick/${{ env.VERSION }}
          body_path: release-notes.md
